<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condo Games Private</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0a12;
        }
    </style>
</head>
<body class="text-white min-h-screen p-4 pb-12 flex justify-center">

    <!-- Container Utama HP -->
    <div class="w-full max-w-md space-y-4">
        
        <!-- Header Navigation Bar -->
        <div class="flex items-center space-x-2 pt-2 mb-2">
            <div class="bg-gradient-to-tr from-purple-600 to-pink-500 p-2 rounded-xl flex items-center justify-center shadow-lg">
                <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M11 0L3 11h6l-2 9 10-11h-6l2-9z"/>
                </svg>
            </div>
            <h1 class="font-extrabold tracking-wider text-sm uppercase">CONDO <span class="text-pink-500">GAMES</span></h1>
        </div>

        <!-- 1. Banner Card Paling Atas (Video / Live Preview) -->
        <div class="bg-[#151324] rounded-3xl overflow-hidden border border-white/5 shadow-2xl relative">
            <div class="relative h-48 bg-gray-900 overflow-hidden">
                
                <!-- Tag Video Autoplay -->
                <video 
                    autoplay 
                    loop 
                    muted 
                    playsinline 
                    poster="https://via.placeholder.com/600x400/151324/ffffff?text=Video+Loading..." 
                    class="w-full h-full object-cover">
                    <!-- Ganti "video-banner.mp4" dengan nama/link file video kamu -->
                    <source src="https://files.catbox.moe/gtsbld.mp4" type="video/mp4">
                    Browser kamu tidak mendukung video.
                </video>
                
                <!-- Badge Merah LIVE (Atas-Kiri) -->
                <div class="absolute top-3 left-3 bg-red-600/90 backdrop-blur-md text-[10px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1.5 border border-red-400/30 z-10">
                    <span class="w-2 h-2 bg-white rounded-full animate-pulse"></span> LIVE
                </div>

                <!-- Badge Avatar Creator (Bawah-Kiri) -->
                <div class="absolute bottom-3 left-3 bg-[#0b0a12]/80 backdrop-blur-md px-3 py-1.5 rounded-2xl flex items-center gap-2 border border-white/10 z-10">
                    <div class="w-6 h-6 rounded-full bg-purple-600 overflow-hidden border border-white/20">
                        <!-- Ganti "avatar-profile.png" dengan gambar avatar profil -->
                        <img src="avatar-profile.png" alt="Profile" class="w-full h-full object-cover" onError="this.src='https://via.placeholder.com/50/8b5cf6/ffffff?text=C'">
                    </div>
                    <span class="text-xs font-semibold text-white">Condo_Games</span>
                </div>
            </div>

            <!-- Teks Deskripsi Banner -->
            <div class="p-4">
                <h2 class="text-lg font-bold">Condo Games Private</h2>
                <p class="text-gray-400 text-xs mt-1 leading-relaxed">Choose your favorite Roblox private server and join now</p>
            </div>
        </div>

        <!-- 2. Section Title Bar -->
        <div class="flex justify-between items-center text-xs px-1 pt-1">
            <span class="flex items-center gap-1.5 font-bold text-white text-sm">
                <span class="text-purple-400">💎</span> Private Servers
            </span>
            <span class="text-gray-400 font-medium">2 Servers • 26 Online</span>
        </div>

        <!-- 3. Server Card 01 -->
        <div class="bg-[#151324] rounded-3xl p-4 border border-white/5 space-y-3 shadow-xl">
            <!-- Preview Server 01 -->
            <div class="relative h-36 bg-gray-900 rounded-2xl overflow-hidden">
                <!-- Ganti "server1-preview.jpg" dengan foto screenshot/preview Server 1 -->
                <img src="server1-preview.jpg" alt="Server 01" class="w-full h-full object-cover" onError="this.src='https://via.placeholder.com/600x300/1a1829/888888?text=Server+01+Preview'">
                
                <!-- Status Available -->
                <div class="absolute top-3 right-3 bg-emerald-500/20 backdrop-blur-md border border-emerald-500/40 text-emerald-400 text-[10px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1">
                    <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-ping"></span> AVAILABLE
                </div>
            </div>

            <!-- Info Server 01 -->
            <div class="space-y-2">
                <h3 class="font-bold text-base">Server 01</h3>
                <div class="flex items-center justify-between">
                    <!-- Icon Avatar Members -->
                    <div class="flex -space-x-2">
                        <div class="w-7 h-7 rounded-full bg-purple-500 border-2 border-[#151324] overflow-hidden">
                            <img src="https://via.placeholder.com/50/a855f7/ffffff?text=1" class="w-full h-full object-cover" alt="User">
                        </div>
                        <div class="w-7 h-7 rounded-full bg-blue-500 border-2 border-[#151324] overflow-hidden">
                            <img src="https://via.placeholder.com/50/3b82f6/ffffff?text=2" class="w-full h-full object-cover" alt="User">
                        </div>
                        <div class="w-7 h-7 rounded-full bg-pink-500 border-2 border-[#151324] overflow-hidden">
                            <img src="https://via.placeholder.com/50/ec4899/ffffff?text=3" class="w-full h-full object-cover" alt="User">
                        </div>
                    </div>
                    <span class="text-xs text-gray-400 font-medium">14 / 20 Online</span>
                </div>
            </div>

            <!-- Tombol Join Server 01 -->
            <a href="https://www.roblox.com/games/share?code=LINK_SERVER_1_KAMU" 
               target="_blank" 
               rel="noopener noreferrer"
               class="block w-full py-3.5 bg-gradient-to-r from-purple-600 to-pink-500 rounded-2xl font-bold text-sm text-center tracking-wide uppercase shadow-lg shadow-purple-900/30 hover:opacity-95 active:scale-[0.98] transition-all duration-150">
                JOIN SERVER
            </a>
        </div>

        <!-- 4. Server Card 02 -->
        <div class="bg-[#151324] rounded-3xl p-4 border border-white/5 space-y-3 shadow-xl">
            <!-- Preview Server 02 -->
            <div class="relative h-36 bg-gray-900 rounded-2xl overflow-hidden">
                <!-- Ganti "server2-preview.jpg" dengan foto screenshot/preview Server 2 -->
                <img src="server2-preview.jpg" alt="Server 02" class="w-full h-full object-cover" onError="this.src='https://via.placeholder.com/600x300/1a1829/888888?text=Server+02+Preview'">
                
                <!-- Status Available -->
                <div class="absolute top-3 right-3 bg-emerald-500/20 backdrop-blur-md border border-emerald-500/40 text-emerald-400 text-[10px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1">
                    <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-ping"></span> AVAILABLE
                </div>
            </div>

            <!-- Info Server 02 -->
            <div class="space-y-2">
                <h3 class="font-bold text-base">Server 02</h3>
                <div class="flex items-center justify-between">
                    <!-- Icon Avatar Members -->
                    <div class="flex -space-x-2">
                        <div class="w-7 h-7 rounded-full bg-amber-500 border-2 border-[#151324] overflow-hidden">
                            <img src="https://via.placeholder.com/50/f59e0b/ffffff?text=4" class="w-full h-full object-cover" alt="User">
                        </div>
                        <div class="w-7 h-7 rounded-full bg-emerald-500 border-2 border-[#151324] overflow-hidden">
                            <img src="https://via.placeholder.com/50/10b981/ffffff?text=5" class="w-full h-full object-cover" alt="User">
                        </div>
                    </div>
                    <span class="text-xs text-gray-400 font-medium">2 / 20 Online</span>
                </div>
            </div>

            <!-- Tombol Join Server 02 -->
            <a href="https://www.roblox.com/games/share?code=LINK_SERVER_2_KAMU" 
               target="_blank" 
               rel="noopener noreferrer"
               class="block w-full py-3.5 bg-gradient-to-r from-purple-600 to-pink-500 rounded-2xl font-bold text-sm text-center tracking-wide uppercase shadow-lg shadow-purple-900/30 hover:opacity-95 active:scale-[0.98] transition-all duration-150">
                JOIN SERVER
            </a>
        </div>

        <!-- Footer Netlify (Opsional) -->
        <div class="flex justify-center items-center gap-1.5 pt-4 text-xs text-gray-400">
            <svg class="w-4 h-4 text-emerald-400" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <span>Powered by Netlify</span>
        </div>

    </div>

</body>
</html>
